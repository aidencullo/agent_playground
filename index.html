<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Exchange Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #00d2ff, #7b2ff7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      background: linear-gradient(90deg, #00d2ff, #7b2ff7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header .status {
      margin-left: auto;
      font-size: 0.75rem;
      color: #4ade80;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    header .status::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
    }

    .ticker-bar {
      background: #12121f;
      padding: 8px 16px;
      border-bottom: 1px solid #1e1e35;
      overflow: hidden;
      white-space: nowrap;
      font-size: 0.8rem;
      color: #888;
    }

    .ticker-content {
      display: inline-block;
      animation: scroll 40s linear infinite;
    }

    .ticker-content span {
      margin-right: 32px;
    }

    .ticker-content .rate-value {
      color: #4ade80;
      font-weight: 600;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 75%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.bot {
      background: #1e1e35;
      border: 1px solid #2a2a4a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background: linear-gradient(135deg, #1a3a5c, #1a2a4c);
      border: 1px solid #2a4a6c;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      color: #7b2ff7;
      font-weight: 600;
    }

    .message.user .label {
      color: #00d2ff;
      text-align: right;
    }

    .message table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    .message th, .message td {
      text-align: left;
      padding: 6px 12px;
      border-bottom: 1px solid #2a2a4a;
      font-size: 0.85rem;
    }

    .message th {
      color: #7b2ff7;
      font-weight: 600;
    }

    .message td.rate {
      color: #4ade80;
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    .message .convert-result {
      background: #12121f;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 8px;
      text-align: center;
    }

    .message .convert-result .amount {
      font-size: 1.4rem;
      font-weight: 700;
      color: #4ade80;
      font-family: 'Courier New', monospace;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 14px 18px;
      align-self: flex-start;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #7b2ff7;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-area {
      padding: 16px 24px;
      background: #12121f;
      border-top: 1px solid #2a2a4a;
      display: flex;
      gap: 12px;
    }

    .input-area input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #2a2a4a;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #7b2ff7;
    }

    .input-area input::placeholder {
      color: #555;
    }

    .input-area button {
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7b2ff7, #00d2ff);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .input-area button:hover { opacity: 0.85; }
    .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

    .suggestions {
      padding: 8px 24px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .suggestions button {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #2a2a4a;
      background: #1a1a2e;
      color: #aaa;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestions button:hover {
      border-color: #7b2ff7;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">$</div>
    <h1>FX Rate Chatbot</h1>
    <div class="status">Live rates</div>
  </header>

  <div class="ticker-bar">
    <div class="ticker-content" id="ticker">Loading rates...</div>
  </div>

  <div class="chat-container" id="chat"></div>

  <div class="suggestions" id="suggestions">
    <button onclick="sendMessage('What is the USD to EUR rate?')">USD to EUR</button>
    <button onclick="sendMessage('Convert 500 GBP to JPY')">500 GBP to JPY</button>
    <button onclick="sendMessage('Show me top rates for USD')">Top USD rates</button>
    <button onclick="sendMessage('What currencies are available?')">All currencies</button>
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Ask about exchange rates... e.g. 'USD to EUR' or 'convert 100 dollars to euros'" />
    <button id="sendBtn" onclick="sendFromInput()">Send</button>
  </div>

  <script>
    const FRANKFURTER_BASE = 'https://api.frankfurter.app';
    let ratesCache = {};
    let lastFetchTime = 0;

    const CURRENCY_NAMES = {
      AUD: 'Australian Dollar', BGN: 'Bulgarian Lev', BRL: 'Brazilian Real',
      CAD: 'Canadian Dollar', CHF: 'Swiss Franc', CNY: 'Chinese Yuan',
      CZK: 'Czech Koruna', DKK: 'Danish Krone', EUR: 'Euro',
      GBP: 'British Pound', HKD: 'Hong Kong Dollar', HUF: 'Hungarian Forint',
      IDR: 'Indonesian Rupiah', ILS: 'Israeli Shekel', INR: 'Indian Rupee',
      ISK: 'Icelandic Krona', JPY: 'Japanese Yen', KRW: 'South Korean Won',
      MXN: 'Mexican Peso', MYR: 'Malaysian Ringgit', NOK: 'Norwegian Krone',
      NZD: 'New Zealand Dollar', PHP: 'Philippine Peso', PLN: 'Polish Zloty',
      RON: 'Romanian Leu', SEK: 'Swedish Krona', SGD: 'Singapore Dollar',
      THB: 'Thai Baht', TRY: 'Turkish Lira', USD: 'US Dollar',
      ZAR: 'South African Rand'
    };

    const CURRENCY_ALIASES = {
      dollar: 'USD', dollars: 'USD', usd: 'USD', buck: 'USD', bucks: 'USD',
      euro: 'EUR', euros: 'EUR', eur: 'EUR',
      pound: 'GBP', pounds: 'GBP', gbp: 'GBP', sterling: 'GBP',
      yen: 'JPY', jpy: 'JPY',
      yuan: 'CNY', renminbi: 'CNY', rmb: 'CNY', cny: 'CNY',
      rupee: 'INR', rupees: 'INR', inr: 'INR',
      franc: 'CHF', francs: 'CHF', chf: 'CHF',
      real: 'BRL', reais: 'BRL', brl: 'BRL',
      peso: 'MXN', pesos: 'MXN', mxn: 'MXN',
      won: 'KRW', krw: 'KRW',
      rand: 'ZAR', zar: 'ZAR',
      lira: 'TRY', try: 'TRY',
      krona: 'SEK', kronor: 'SEK', sek: 'SEK',
      krone: 'NOK', nok: 'NOK',
      baht: 'THB', thb: 'THB',
      ringgit: 'MYR', myr: 'MYR',
      shekel: 'ILS', shekels: 'ILS', ils: 'ILS',
      aud: 'AUD', cad: 'CAD', hkd: 'HKD', sgd: 'SGD', nzd: 'NZD',
      dkk: 'DKK', czk: 'CZK', pln: 'PLN', huf: 'HUF', ron: 'RON',
      bgn: 'BGN', php: 'PHP', idr: 'IDR', isk: 'ISK',
      'australian dollar': 'AUD', 'canadian dollar': 'CAD',
      'hong kong dollar': 'HKD', 'singapore dollar': 'SGD',
      'new zealand dollar': 'NZD',
    };

    async function fetchRates(base = 'USD') {
      try {
        const res = await fetch(`${FRANKFURTER_BASE}/latest?base=${base}`);
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        ratesCache[base] = { rates: data.rates, date: data.date };
        lastFetchTime = Date.now();
        return data;
      } catch (e) {
        console.error('Failed to fetch rates:', e);
        return null;
      }
    }

    async function fetchConversion(from, to, amount) {
      try {
        const res = await fetch(`${FRANKFURTER_BASE}/latest?amount=${amount}&from=${from}&to=${to}`);
        if (!res.ok) throw new Error('API error');
        return await res.json();
      } catch (e) {
        console.error('Conversion error:', e);
        return null;
      }
    }

    function resolveCurrency(text) {
      const cleaned = text.trim().toLowerCase();
      if (CURRENCY_ALIASES[cleaned]) return CURRENCY_ALIASES[cleaned];
      const upper = cleaned.toUpperCase();
      if (CURRENCY_NAMES[upper]) return upper;
      return null;
    }

    function parseUserMessage(msg) {
      const lower = msg.toLowerCase().trim();

      // Check for "currencies available" / "list currencies"
      if (lower.match(/\b(currencies|list|available|supported)\b/)) {
        return { type: 'list' };
      }

      // Check for help
      if (lower.match(/\b(help|how|what can you)\b/) && !lower.match(/\b(rate|convert|price|worth|cost|exchange)\b/)) {
        return { type: 'help' };
      }

      // Check for conversion: "convert 100 USD to EUR" or "100 dollars to euros" or "how much is 100 usd in eur"
      const convertMatch = lower.match(
        /(?:convert\s+)?(\d[\d,]*\.?\d*)\s+([a-z]+(?:\s+[a-z]+)?)\s+(?:to|in|into|=)\s+([a-z]+(?:\s+[a-z]+)?)/
      );
      if (convertMatch) {
        const amount = parseFloat(convertMatch[1].replace(/,/g, ''));
        const from = resolveCurrency(convertMatch[2]);
        const to = resolveCurrency(convertMatch[3]);
        if (from && to) return { type: 'convert', from, to, amount };
      }

      // Check for rate query: "USD to EUR" or "dollar to euro rate"
      const rateMatch = lower.match(
        /([a-z]+(?:\s+[a-z]+)?)\s+(?:to|vs|versus|against|\/)\s+([a-z]+(?:\s+[a-z]+)?)/
      );
      if (rateMatch) {
        const from = resolveCurrency(rateMatch[1]);
        const to = resolveCurrency(rateMatch[2]);
        if (from && to) return { type: 'rate', from, to };
      }

      // Check for "top rates for X" or "rates for X" or just a currency name
      const topMatch = lower.match(/(?:top|all|show|rates?|prices?)(?:\s+\w+)*?\s+(?:for\s+)?([a-z]+(?:\s+[a-z]+)?)/);
      if (topMatch) {
        const base = resolveCurrency(topMatch[1]);
        if (base) return { type: 'top', base };
      }

      // Single currency mentioned
      const words = lower.replace(/[?!.,]/g, '').split(/\s+/);
      for (const w of words) {
        const c = resolveCurrency(w);
        if (c) return { type: 'top', base: c };
      }

      return { type: 'unknown' };
    }

    function formatNumber(n, decimals = 4) {
      return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: decimals });
    }

    async function generateResponse(msg) {
      const parsed = parseUserMessage(msg);

      if (parsed.type === 'help') {
        return `Here's what I can do:<br><br>
          <b>Exchange rates:</b> "USD to EUR" or "dollar to pound"<br>
          <b>Convert amounts:</b> "convert 500 USD to EUR" or "100 dollars to yen"<br>
          <b>Browse rates:</b> "show rates for EUR" or "top USD rates"<br>
          <b>List currencies:</b> "what currencies are available?"<br><br>
          I fetch <b>live rates</b> from the European Central Bank via the Frankfurter API!`;
      }

      if (parsed.type === 'list') {
        const entries = Object.entries(CURRENCY_NAMES)
          .map(([code, name]) => `<b>${code}</b> - ${name}`)
          .join('<br>');
        return `Here are all ${Object.keys(CURRENCY_NAMES).length} supported currencies:<br><br>${entries}`;
      }

      if (parsed.type === 'rate') {
        const data = await fetchRates(parsed.from);
        if (!data || !data.rates[parsed.to]) {
          return `Sorry, I couldn't fetch the ${parsed.from}/${parsed.to} rate right now. Please try again.`;
        }
        const rate = data.rates[parsed.to];
        const inverse = 1 / rate;
        return `
          <div class="convert-result">
            <div style="color:#888;font-size:0.85rem;">Live rate as of ${data.date}</div>
            <div style="margin:8px 0;">1 <b>${parsed.from}</b> (${CURRENCY_NAMES[parsed.from]})</div>
            <div class="amount">${formatNumber(rate)} ${parsed.to}</div>
            <div style="color:#888;font-size:0.8rem;margin-top:6px;">1 ${parsed.to} = ${formatNumber(inverse)} ${parsed.from}</div>
          </div>`;
      }

      if (parsed.type === 'convert') {
        const data = await fetchConversion(parsed.from, parsed.to, parsed.amount);
        if (!data || !data.rates[parsed.to]) {
          return `Sorry, couldn't convert ${parsed.from} to ${parsed.to} right now. Please try again.`;
        }
        const result = data.rates[parsed.to];
        const rate = result / parsed.amount;
        return `
          <div class="convert-result">
            <div style="color:#888;font-size:0.85rem;">Live conversion as of ${data.date}</div>
            <div style="margin:8px 0;">${formatNumber(parsed.amount, 2)} <b>${parsed.from}</b></div>
            <div style="font-size:1.2rem;color:#7b2ff7;margin:4px 0;">=</div>
            <div class="amount">${formatNumber(result, 2)} ${parsed.to}</div>
            <div style="color:#888;font-size:0.8rem;margin-top:6px;">Rate: 1 ${parsed.from} = ${formatNumber(rate)} ${parsed.to}</div>
          </div>`;
      }

      if (parsed.type === 'top') {
        const data = await fetchRates(parsed.base);
        if (!data) return `Sorry, couldn't fetch rates for ${parsed.base} right now.`;

        const sorted = Object.entries(data.rates).sort((a, b) => a[0].localeCompare(b[0]));
        let rows = sorted.map(([code, rate]) =>
          `<tr><td><b>${code}</b></td><td>${CURRENCY_NAMES[code] || code}</td><td class="rate">${formatNumber(rate)}</td></tr>`
        ).join('');

        return `
          Exchange rates for <b>1 ${parsed.base}</b> (${CURRENCY_NAMES[parsed.base]}) as of ${data.date}:
          <table>
            <tr><th>Code</th><th>Currency</th><th>Rate</th></tr>
            ${rows}
          </table>`;
      }

      // Unknown
      return `I'm not sure what you're asking. Try something like:<br><br>
        "What's the USD to EUR rate?"<br>
        "Convert 500 dollars to euros"<br>
        "Show rates for GBP"<br><br>
        Type <b>help</b> for more info!`;
    }

    function addMessage(html, isUser = false) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'user' : 'bot'}`;
      div.innerHTML = `<div class="label">${isUser ? 'You' : 'FX Bot'}</div>${html}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'typing';
      div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function sendMessage(msg) {
      if (!msg.trim()) return;
      document.getElementById('input').value = '';
      document.getElementById('suggestions').style.display = 'none';

      addMessage(msg, true);
      showTyping();

      // Simulate slight delay for natural feel
      await new Promise(r => setTimeout(r, 400 + Math.random() * 600));

      const response = await generateResponse(msg);
      hideTyping();
      addMessage(response);
    }

    function sendFromInput() {
      const input = document.getElementById('input');
      sendMessage(input.value);
    }

    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendFromInput();
    });

    // Init ticker
    async function initTicker() {
      const data = await fetchRates('USD');
      if (!data) {
        document.getElementById('ticker').textContent = 'Unable to load rates';
        return;
      }

      const highlights = ['EUR', 'GBP', 'JPY', 'CAD', 'CHF', 'AUD', 'CNY', 'INR', 'KRW', 'MXN', 'BRL', 'SGD'];
      let html = '';
      for (const code of highlights) {
        if (data.rates[code]) {
          html += `<span>USD/${code} <span class="rate-value">${formatNumber(data.rates[code])}</span></span>`;
        }
      }
      // Duplicate for seamless scroll
      document.getElementById('ticker').innerHTML = html + html;
    }

    // Welcome message
    addMessage(`Welcome to <b>FX Rate Chatbot</b>! I provide <b>live currency exchange rates</b> from the European Central Bank.<br><br>
      Try asking me things like:<br>
      &bull; "What's the transfer rate between dollars and euros?"<br>
      &bull; "Convert 1000 GBP to JPY"<br>
      &bull; "Show me all rates for USD"<br><br>
      Rates are updated daily by the ECB. Ask away!`);

    initTicker();
  </script>
</body>
</html>
